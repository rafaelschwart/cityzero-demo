<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITY 0 OPS · Public Surface Monitor</title>
<link rel="icon" href="assets/logo-cz-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="wordmark">
      <img src="assets/logo-horizontal-white.png" alt="City Zero">
      <span class="ops">OPS</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div style="margin-top:auto"></div>
    <div class="side-status" id="side-status"></div>
    <div class="langrow" role="group" aria-label="Theme">
      <button class="thbtn on" data-t="dark" onclick="setTheme('dark')" aria-label="Dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg> Dark
      </button>
      <button class="thbtn" data-t="light" onclick="setTheme('light')" aria-label="Light mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"></path></svg> Light
      </button>
    </div>
    <div class="langrow" role="group" aria-label="Language">
      <button class="langbtn" data-l="en" onclick="setLang('en')">EN</button>
      <button class="langbtn" data-l="es" onclick="setLang('es')">ES</button>
    </div>
    <div class="side-foot" style="margin-top:0">
      <strong>Read-only monitor</strong>
      No write access to any<br>City Zero system.<br><br>
      Arqentia · Phase 1 demo
    </div>
  </aside>

  <div class="inset">
    <header class="apphdr">
      <div class="ahl">
        <button class="ahbtn" onclick="document.querySelector('.shell').classList.toggle('collapsed')" aria-label="Toggle sidebar" data-tip="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
        </button>
        <span class="ahsep"></span>
        <nav class="crumb" aria-label="Breadcrumb">
          <span>CITY 0 OPS</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg><b id="crumb-sec">Today</b>
        </nav>
      </div>
      <div class="ahr">
        <button class="topsearch" onclick="openCmdk()" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span class="tslabel">Search the dashboard...</span>
          <span class="kbd">Ctrl K</span>
        </button>
        <button class="ahbtn" onclick="setTheme(THEME === 'dark' ? 'light' : 'dark')" aria-label="Toggle theme" data-tip="Theme">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"></path></svg>
        </button>
        <span class="avatar sm ahav" style="cursor:pointer" data-tip="Log out" onclick="localStorage.removeItem('c0.auth');location.href='login.html'">RS</span>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>

</div>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="vendor/anime.min.js"></script>
<script src="charts.js"></script>
<script src="animations.js"></script>
<script src="components.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
<script>
/* debug hook: ?debug=1 lists elements wider than the viewport in a DOM node */
if (location.search.includes("debug=1")) {
  setTimeout(() => {
    const vw = document.documentElement.clientWidth;
    const bad = [];
    document.querySelectorAll("*").forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width > vw + 1 || r.right > vw + 1) {
        bad.push(`${el.tagName}.${(el.className || "").toString().split(" ")[0]}=${Math.round(r.width)}/right${Math.round(r.right)}`);
      }
    });
    const d = document.createElement("pre");
    d.id = "OVERFLOW_DEBUG";
    d.textContent = `vw=${vw} scrollW=${document.documentElement.scrollWidth} :: ${bad.slice(0, 12).join(" | ")}`;
    document.body.appendChild(d);
  }, 700);
}
</script>
</body>
</html>
